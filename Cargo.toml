[package]
name = "memcache"
version = "0.1.0"
edition = "2024"
description = "High-performance async memcached CacheService for the example breeze platform"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
bytes = "1"
thiserror = "2"
tracing = "0.1"
arc-swap = "1.9.2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
md5 = "0.7"
rand = "0.8"
async-trait = "0.1"
vintage = { path = "../vintage", optional = true }
futures-util = "0.3.34"
brz-discovery = { workspace = true }
brz-net = { package = "net", path = "../net" }
brz-metrics = { package = "metrics", path = "../metrics", optional = true }
enum_dispatch = "0.3.8"
itoa = "1"

[features]
default = []
# Enable Vintage-backed live cache-service configuration.
service = ["dep:vintage"]
# Emit ProfileUtil-compatible MC and MCDETAIL physical-access metrics.
metrics = ["dep:brz-metrics"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"

# This crate is itself the SDK (`memcache`) and the workspace root.
[workspace]
members = []
resolver = "2"

[workspace.dependencies]
# Shared Breeze checkout managed by the consuming repository.
brz-discovery = { package = "discovery", path = "../discovery" }
