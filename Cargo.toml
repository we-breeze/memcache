[package]
name = "memcache"
version = "0.1.0"
edition = "2024"
description = "High-performance, high-availability async memcached client for the example breeze platform (sidecar / direct / replay modes, text + binary protocols)"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
bytes = "1"
deadpool = { version = "0.13", features = ["managed", "rt_tokio_1"] }
thiserror = "2"
tracing = "0.1"
arc-swap = "1.9.2"
socket2 = { version = "0.6.5", features = ["all"] }
memchr = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
md5 = "0.7"
rand = "0.8"
async-trait = { version = "0.1", optional = true }
vintage = { path = "../vintage", optional = true }

[features]
direct-tcp = ["memchr"]
memchr = ["dep:memchr"]
# Cache-service templates: `Cacheable`, `ShardedCache`, `MemCacheTemplate`,
# `MemcacheServiceTemplate`, and the Vintage backup integration, under
# `memcache::service` (a Rust port of the Java commons-memcache templates).
service = ["dep:async-trait", "dep:vintage"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
tracing-subscriber = "0.3"
async-trait = "0.1"

# This crate is itself the SDK (`memcache`) AND the workspace root. The
# `mc-bench` load-test harness lives under `tools/mc-bench` and is the only
# other member.
[workspace]
members = ["tools/mc-bench"]
resolver = "2"

[workspace.dependencies]
# Shared with the redis SDK: the bench harness installs this allocator at
# its binary composition root to get mimalloc + per-request allocation
# accounting. The SDK itself stays allocator-agnostic.
brz-mem = { path = "../redis/memory", version = "0.1.0", default-features = false }
