[package]
name = "brz-memcache"
version = "0.0.4"
edition = "2024"
description = "Asynchronous memcached client with sharding, failover, and live configuration"
license = "MIT OR Apache-2.0"
repository = "https://github.com/we-breeze/memcache"
readme = "README.md"

[dependencies]
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
bytes = "1"
thiserror = "2"
tracing = "0.1"
arc-swap = "1.9.2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
md5 = "0.7"
rand = "0.8"
async-trait = "0.1"
futures-util = "0.3.34"
brz-net = { package = "brz-net", version = "0.0.2" }
brz-metrics = { package = "brz-metrics", version = "=0.0.5", optional = true }
enum_dispatch = "0.3.8"
itoa = "1"

[features]
default = []
# Compatibility feature; live configuration is now available by default.
service = []
# Emit ProfileUtil-compatible MC and MCDETAIL physical-access metrics.
metrics = ["dep:brz-metrics"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"

# This crate is itself the SDK (`memcache`) and the workspace root.
[workspace]
members = []
resolver = "2"


[lib]
name = "brz_memcache"
