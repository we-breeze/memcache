[package]
name = "memcache"
version = "0.1.0"
edition = "2024"
description = "High-performance async memcached client (text + binary protocol) for the byMesh sidecar path"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
bytes = "1"
deadpool = { version = "0.13", features = ["managed", "rt_tokio_1"] }
thiserror = "2"
tracing = "0.1"
arc-swap = "1.9.2"
socket2 = { version = "0.6.5", features = ["all"] }
memchr = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

[features]
direct-tcp = ["memchr"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
tracing-subscriber = "0.3"
